version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: heat
      POSTGRES_USER: heat
      POSTGRES_PASSWORD: heat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heat -d heat"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/heat
      DB_USER: heat
      DB_PASSWORD: heat
      APP_STORAGE_DIR: /app/data/uploads
      JAVA_OPTS: "${JAVA_OPTS:--Xmx8g -XX:+UseG1GC}"
      APP_ROUTING_ENGINE: ${ROUTING_ENGINE:-core}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - appdata:/app/data

volumes:
  pgdata:
  appdata:
