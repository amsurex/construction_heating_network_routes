name: Ubuntu 22 compose smoke

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the required docker-compose 1.29.2
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes docker-compose=1.29.2-1
          test "$(docker-compose version --short)" = "1.29.2"
          docker-compose config --quiet
      - name: Build and start the clean stack
        run: |
          docker-compose down --volumes --remove-orphans
          docker-compose up --build --detach
      - name: Exercise upload, calculation, download and validation
        run: >-
          python3 tools/smoke_api.py
          --input data/samples/dataset.geojson
          --output data/results/ubuntu-smoke
      - name: Show service logs on failure
        if: failure()
        run: docker-compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker-compose down --volumes --remove-orphans
